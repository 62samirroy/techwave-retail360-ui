name: Frontend UI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://royalsaree.techwavesolutions.dev/api"
          NEXT_PUBLIC_SITE_URL: "https://royalsaree.techwavesolutions.dev"
          NEXT_PUBLIC_STORE_NAME: "Royal Saree & Fashion"
          NEXT_PUBLIC_STORE_PHONE: "+91 9641145871"
          NEXT_PUBLIC_STORE_EMAIL: "techwavesolutions.dev@gmail.com"
          NEXT_PUBLIC_WHATSAPP_PHONE: "+919641145871"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: techwave/retail360-ui:test
